mmindmap
  root((Inteligencia Emocional))
    Marco Contextual
      Definición: "Reconocer y comprender emociones propias y ajenas; guiar pensamiento y conducta"
      Importancia: "Éxito personal y profesional; decisiones, comunicación y gestión del estrés"
    Dimensiones y Competencias
      Autoconciencia: "Reconocer emociones propias"
      Autocontrol: "Regular emociones propias"
      Motivación: "Utilizar emociones para dirigir conducta"
      Empatía: "Reconocer emociones en otros"
      Habilidades Sociales: "Interactuar y comunicarse efectivamente"
    Orígenes y Evolución
      Salovey & Mayer: "Concepto surgido en la década de 1990"
      Goleman: "Popularizó la IE en 1995"
    Modelos de Inteligencia Emocional
      Modelo de Salovey y Mayer: "Enfocado en autoconciencia, autocontrol, motivación, empatía y habilidades sociales"
      Modelo de Goleman: "Incluye gestión de relaciones además de las dimensiones anteriores"
    Cerebro y Emociones
      Cerebro Emocional: "Procesamiento en la amígdala y sistema límbico"
      Neurotransmisores: "Dopamina, serotonina y adrenalina regulan emociones"
    Emociones Primarias
      Alegría: "Felicidad y satisfacción"
      Tristeza: "Pérdida y desesperanza"
      Miedo: "Amenaza y peligro"
      Ira: "Frustración y agresión"
      Sorpresa: "Novedad y asombro"
    Fundamentos de IE
      Conciencia Emocional: "Reconocer y comprender emociones"
      Regulación Emocional: "Gestionar y regular emociones"
      Motivación Emocional: "Utilizar emociones para motivar y dirigir conducta"
